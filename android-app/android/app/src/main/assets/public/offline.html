<script>
  document.querySelector('.bg').style.backgroundImage = 'url(' + document.getElementById('pic').src + ')';
  var TARGET = 'https://bober-api.gt.tc/pages/clicker/index.html';
  var busy = false;
  function retry() {
    if (busy) return;
    busy = true;
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, 5000);
    fetch(TARGET, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
      .then(function () { location.replace(TARGET); })
      .catch(function () {})
      .then(function () { clearTimeout(t); busy = false; });
  }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);
  setInterval(retry, 4000);
</script>
