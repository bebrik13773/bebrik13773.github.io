name: 📱 Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps + sync Capacitor
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android

      - name: Build release APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify app-release-signed.apk

      - name: Publish GitHub Release
        working-directory: android-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          TAG="apk-v$VERSION"
          cp app-release-signed.apk "bober-clicker-v$VERSION.apk"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" "bober-clicker-v$VERSION.apk" \
            --title "Бобёр кликер APK v$VERSION" \
            --notes "Android-приложение Бобёр кликер v$VERSION" \
            --target "$GITHUB_SHA"
